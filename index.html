<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO NOTE: the production domain is a placeholder until the site is deployed.
      Find-and-replace https://laurieranalytics.ca with the real domain across
      this file, public/robots.txt and public/sitemap.xml when it's known.
    -->
    <link rel="canonical" href="https://laurieranalytics.ca/" />

    <title>Laurier Analytics Society (LAS) — Data & Analytics Club at WLU</title>
    <meta
      name="description"
      content="Laurier Analytics Society (LAS): Wilfrid Laurier University's student-run data &amp; analytics community — workshops, mentorship, speaker nights, and the annual LAS Datathon. Every major welcome." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Laurier Analytics Society" />
    <meta name="theme-color" content="#070b0d" />

    <!-- Speed up webfont delivery (fonts are @imported from Google Fonts in CSS). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laurier Analytics Society" />
    <meta property="og:title" content="Laurier Analytics Society (LAS) — Data & Analytics Club at WLU" />
    <meta
      property="og:description"
      content="Wilfrid Laurier University's student-run data &amp; analytics community — workshops, mentorship, speaker nights, and the annual LAS Datathon. Every major welcome." />
    <meta property="og:url" content="https://laurieranalytics.ca/" />
    <meta property="og:image" content="https://laurieranalytics.ca/data-minds-challenge.jpg" />
    <meta property="og:image:alt" content="Laurier Analytics Society members at the LAS Datathon." />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Laurier Analytics Society (LAS) — Data & Analytics Club at WLU" />
    <meta
      name="twitter:description"
      content="Wilfrid Laurier University's student-run data &amp; analytics community — workshops, mentorship, and the annual LAS Datathon." />
    <meta name="twitter:image" content="https://laurieranalytics.ca/data-minds-challenge.jpg" />
    <meta name="twitter:image:alt" content="Laurier Analytics Society members at the LAS Datathon." />

    <!-- Structured data: the organization and the site. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Laurier Analytics Society",
        "alternateName": "LAS",
        "url": "https://laurieranalytics.ca/",
        "logo": "https://laurieranalytics.ca/favicon.svg",
        "description": "Wilfrid Laurier University's student-run data and analytics community — workshops, industry mentorship, speaker nights, and the annual LAS Datathon.",
        "foundingDate": "2021",
        "parentOrganization": {
          "@type": "CollegeOrUniversity",
          "name": "Wilfrid Laurier University"
        },
        "sameAs": [
          "https://www.instagram.com/laurier_analytics",
          "https://www.linkedin.com/company/laurier-analytics-society-las"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Laurier Analytics Society",
        "url": "https://laurieranalytics.ca/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
